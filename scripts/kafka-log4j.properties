# Configuración de logging para el broker local (log4j 1.x, el que usa Kafka 3.7).
# Sin servidor de logs externo: solo consola y un fichero por componente dentro
# de data\. Así se evita el "FileNotFoundException: \server.log" que aparece
# cuando kafka.logs.dir no está definido.
log4j.rootLogger=INFO, stdout

log4j.appender.stdout=org.apache.log4j.ConsoleAppender
log4j.appender.stdout.layout=org.apache.log4j.PatternLayout
log4j.appender.stdout.layout.ConversionPattern=[%d{ISO8601}] %p %m (%c{1})%n

log4j.logger.kafka=INFO
log4j.logger.org.apache.kafka=INFO
log4j.logger.kafka.server.KafkaServer=INFO
log4j.logger.kafka.network.RequestChannel$=WARN
log4j.logger.kafka.request.logger=WARN
log4j.logger.state.change.logger=INFO
log4j.logger.kafka.controller=INFO
log4j.logger.kafka.log.LogCleaner=INFO
log4j.logger.kafka.utils.VerifiableProperties=WARN
