<svg viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-title architecture-desc">
  <title id="architecture-title">LoL Coach: arquitectura de ingesta y análisis</title>
  <desc id="architecture-desc">Una API sintética con cuotas y límites alimenta dos modos de ingesta, dlt directo y Fetcher con bus y LakeConsumer, que convergen en un lago Parquet del que DuckDB construye las vistas analíticas.</desc>
